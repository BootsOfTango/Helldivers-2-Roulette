name: Windows Release ZIP

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version to use for the test build'
        required: true
        default: '22'
        type: string

permissions:
  contents: write

jobs:
  windows-zip:
    name: Validate, build, and package Windows ZIP
    runs-on: windows-latest
    env:
      NODE_VERSION: ${{ inputs.node-version || '22' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          $actualTag = "${{ github.ref_name }}"
          if ($actualTag -ne $expectedTag) {
            Write-Error "Tag '$actualTag' does not match package.json version '$($package.version)' (expected '$expectedTag')."
            exit 1
          }
          Write-Host "Tag $actualTag matches package.json version $($package.version)."

      - name: Run catalog validation
        run: npm run validate:catalog

      - name: Run asset validation
        run: npm run validate:assets

      - name: Run storage and application tests
        run: npm test

      - name: Build Windows application
        run: npm run build:win

      - name: Verify Windows ZIP contents and generate checksum
        run: python scripts/verify_win_zip.py

      - name: Verify expected executable and required assets
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $zipPath = "dist/Helldivers-2-Chaos-Roulette-v$($package.version)-win-x64.zip"
          if (!(Test-Path $zipPath)) {
            Write-Error "Missing expected ZIP: $zipPath"
            exit 1
          }

          $entries = tar -tf $zipPath
          $required = @(
            'Helldivers 2 Chaos Roulette.exe',
            'resources/app.asar',
            'README-FIRST.txt',
            'assets/item-catalog.json',
            'assets/item-images.json',
            'assets/branding/helldivers-2-logo.svg',
            'build/icon.ico'
          )
          foreach ($needle in $required) {
            if (!($entries | Where-Object { $_ -like "*$needle*" })) {
              Write-Error "Required package entry is missing: $needle"
              exit 1
            }
          }
          Write-Host "Required executable and assets are present in $zipPath."

      - name: Upload test build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-build-${{ github.run_number }}
          path: |
            dist/Helldivers-2-Chaos-Roulette-v*-win-x64.zip
            dist/Helldivers-2-Chaos-Roulette-v*-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Attach ZIP and checksum to matching GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/Helldivers-2-Chaos-Roulette-v*-win-x64.zip
            dist/Helldivers-2-Chaos-Roulette-v*-win-x64.zip.sha256
          fail_on_unmatched_files: true
